name: Build Windows Wheel Only

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v6.7.2)'
        required: true
        default: 'v6.7.2'

jobs:
  # ============================================================================
  # Windows 构建（仅验证，不推送 PyPI）
  # ============================================================================
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          choco install swig boost-msvc-14.3 --yes
          pip install --upgrade build

      - name: Build wheel
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist, build, _skbuild
          python -m build --wheel
          Get-ChildItem dist\*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctpx-windows-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 7

  # ============================================================================
  # 仅追加 Windows wheel 到现有 GitHub Release，不推送 PyPI
  # ============================================================================
  update-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: ctpx-windows-*
          merge-multiple: true

      - name: List downloaded wheels
        run: |
          ls -la dist/
          find dist -name "*.whl" | sort

      - name: Append Windows wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ctpx ${{ github.event.inputs.tag_name }}
          files: dist/*.whl
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
