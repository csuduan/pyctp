name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v6.7.2)'
        required: true
        default: 'v6.7.2'

permissions:
  contents: write

jobs:
  # ============================================================================
  # macOS 构建
  # ============================================================================
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          brew install cmake swig boost
          pip install --upgrade pip setuptools wheel build

      - name: Build API
        run: |
          cd api
          mkdir -p build && cd build
          cmake ..
          make -j$(sysctl -n hw.ncpu)
          cd ../..

      - name: Copy files to package
        run: bash .github/workflows/copy-files.sh mac

      - name: Package wheel
        run: |
          cd package
          rm -rf dist
          mkdir -p dist
          pip wheel . -w dist/
          ls -la dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctpx-macos-${{ matrix.os }}-py${{ matrix.python-version }}
          path: package/dist/*.whl
          retention-days: 7

  # ============================================================================
  # Linux 构建 (直接在 Ubuntu 上编译 + auditwheel 修复)
  # ============================================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake swig libboost-all-dev patchelf python3-dev build-essential
          pip install --upgrade pip setuptools wheel build auditwheel

      - name: Build API
        run: |
          cd api
          rm -rf build
          mkdir -p build && cd build
          cmake ..
          make -j$(nproc)
          cd ../..

      - name: Copy files to package
        run: bash .github/workflows/copy-files.sh linux

      - name: Fix RPATH
        run: |
          for impl_dir in package/ctpx/*/; do
            if [[ ! -d "$impl_dir" ]]; then continue; fi
            impl_name=$(basename "$impl_dir")
            if [[ "$impl_name" == "ctp" ]]; then continue; fi
            for lib in libthosttraderapi_se.so libthostmduserapi_se.so; do
              lib_path="${impl_dir}/${lib}"
              if [[ -f "$lib_path" ]]; then
                echo "Setting RPATH for ${impl_name}/${lib}"
                patchelf --set-rpath '$ORIGIN' "$lib_path"
              fi
            done
          done

      - name: Build wheel
        run: |
          cd package
          rm -rf dist
          mkdir -p dist
          pip wheel . -w dist/

      - name: Repair wheel with auditwheel
        run: |
          cd package
          for whl in dist/*.whl; do
            if [[ -f "$whl" ]]; then
              auditwheel repair "$whl" --plat manylinux_2_31_x86_64 -w wheelhouse/
            fi
          done
          ls -la wheelhouse/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctpx-linux-manylinux_2_31
          path: package/wheelhouse/*.whl
          retention-days: 7

  # ============================================================================
  # 发布 Release
  # ============================================================================
  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ctpx-*

      - name: Collect wheels
        run: |
          mkdir -p release
          find artifacts -name "*.whl" -exec cp {} release/ \;
          ls -la release/

      - name: Get tag name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ctpx ${{ steps.get_tag.outputs.tag }}
          body: |
            ctpx wheel packages for macOS and Linux.

            ## Supported Platforms
            - macOS (arm64)
            - Linux (manylinux compatible)

            ## Install
            ```bash
            pip install ctpx --find-links https://github.com/csuduan/pyctp/releases
            ```
          files: release/*.whl
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
