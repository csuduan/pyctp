name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v6.7.2)'
        required: true
        default: 'v6.7.2'

permissions:
  contents: write

jobs:
  # ============================================================================
  # macOS 构建
  # ============================================================================
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          brew install cmake swig boost
          pip install --upgrade build

      - name: Build wheel
        run: |
          rm -rf dist build _skbuild
          python -m build --wheel
          ls -la dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctpx-macos-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 7

  # ============================================================================
  # Linux 构建 (cibuildwheel + manylinux_2_34)
  # ============================================================================
  build-linux:
    runs-on: ubuntu-latest
    env:
      CIBW_BUILD_VERBOSITY: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.1.0

      - name: Build wheels
        run: |
          set -o pipefail
          mkdir -p wheelhouse
          python -m cibuildwheel --output-dir wheelhouse . 2>&1 | tee cibuildwheel.log

      - name: Post cibuildwheel log as commit comment on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          log_lines = open('cibuildwheel.log').read().splitlines()
          body = "cibuildwheel failed. Last 200 lines of log:\n\n```\n" + "\n".join(log_lines[-200:]) + "\n```"
          data = json.dumps({"body": body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
              data=data,
              headers={
                  "Authorization": f"token {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github.v3+json"
              }
          )
          urllib.request.urlopen(req)
          PY

      - name: Upload wheel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ctpx-linux-manylinux_2_34
          path: wheelhouse/*.whl
          retention-days: 7

  # ============================================================================
  # 发布 Release
  # ============================================================================
  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ctpx-*

      - name: Collect wheels
        run: |
          mkdir -p release
          find artifacts -name "*.whl" -exec cp {} release/ \;
          ls -la release/

      - name: Get tag name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ctpx ${{ steps.get_tag.outputs.tag }}
          body: |
            ctpx wheel packages for macOS and Linux.

            ## Supported Platforms
            - macOS (arm64, macOS >= 11.0)
            - Linux (x86_64, manylinux_2_34, compatible with Ubuntu 22.04+)

            ## Install
            ```bash
            pip install ctpx --find-links https://github.com/csuduan/pyctp/releases
            ```
          files: release/*.whl
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
