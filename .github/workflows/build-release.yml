name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v6.7.2)'
        required: true
        default: 'v6.7.2'

permissions:
  contents: write

jobs:
  # ============================================================================
  # macOS 构建
  # ============================================================================
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          brew install cmake swig boost
          pip install --upgrade pip setuptools wheel build

      - name: Build API
        run: |
          cd api
          mkdir -p build && cd build
          cmake ..
          make -j$(sysctl -n hw.ncpu)
          cd ../..

      - name: Copy files to package
        run: bash .github/workflows/copy-files.sh mac

      - name: Package wheel
        run: |
          cd package
          rm -rf dist
          mkdir -p dist
          pip wheel . -w dist/
          ls -la dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctpx-macos-${{ matrix.os }}-py${{ matrix.python-version }}
          path: package/dist/*.whl
          retention-days: 7

  # ============================================================================
  # Linux 构建 (使用 cibuildwheel 标准方案)
  # ============================================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: cp312-manylinux_x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL: |
            dnf install -y cmake swig boost-devel patchelf python3-devel gcc-c++ make
          CIBW_BEFORE_BUILD: |
            cd {project}/api
            rm -rf build
            mkdir -p build && cd build
            cmake ..
            make -j$(nproc)
            cd {project}
            bash .github/workflows/copy-files.sh linux
          CIBW_REPAIR_WHEEL_COMMAND: |
            auditwheel repair -w {dest_dir} {wheel}
        with:
          package-dir: package

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctpx-linux-manylinux_2_28
          path: package/wheelhouse/*.whl
          retention-days: 7

  # ============================================================================
  # 发布 Release
  # ============================================================================
  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ctpx-*

      - name: Collect wheels
        run: |
          mkdir -p release
          find artifacts -name "*.whl" -exec cp {} release/ \;
          ls -la release/

      - name: Get tag name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ctpx ${{ steps.get_tag.outputs.tag }}
          body: |
            ctpx wheel packages for macOS and Linux.

            ## Supported Platforms
            - macOS (arm64)
            - Linux (manylinux compatible)

            ## Install
            ```bash
            pip install ctpx --find-links https://github.com/csuduan/pyctp/releases
            ```
          files: release/*.whl
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
