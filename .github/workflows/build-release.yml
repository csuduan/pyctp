name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v6.7.2)'
        required: true
        default: 'v6.7.2'

jobs:
  # ============================================================================
  # macOS 构建
  # ============================================================================
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          brew install cmake swig boost
          pip install --upgrade build

      - name: Build wheel
        run: |
          rm -rf dist build _skbuild
          python -m build --wheel
          ls -la dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctpx-macos-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 7

  # ============================================================================
  # Windows 构建
  # ============================================================================
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          choco install swig boost --yes
          pip install --upgrade build

      - name: Build wheel
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist, build, _skbuild
          python -m build --wheel
          Get-ChildItem dist\*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctpx-windows-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 7

  # ============================================================================
  # Linux 构建 (cibuildwheel + manylinux_2_34)
  # ============================================================================
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctpx-linux-manylinux_2_34
          path: wheelhouse/*.whl
          retention-days: 7

  # ============================================================================
  # 发布到 PyPI 并创建 GitHub Release
  # ============================================================================
  release-and-publish:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ctpx
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: ctpx-*
          merge-multiple: true

      - name: List downloaded wheels
        run: |
          ls -la dist/
          find dist -name "*.whl" | sort

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Get tag name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ctpx ${{ steps.get_tag.outputs.tag }}
          body: |
            ctpx wheel packages for macOS, Linux and Windows.

            ## Supported Platforms
            - macOS (arm64, macOS >= 11.0)
            - Linux (x86_64, manylinux_2_34, compatible with Ubuntu 22.04+)
            - Windows (x86_64, Windows 10/Server 2019+)

            ## Install
            ```bash
            pip install ctpx
            ```
          files: dist/*.whl
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
